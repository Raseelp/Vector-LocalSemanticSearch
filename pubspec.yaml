name: twentyonevision
description: "Vector — local, on-device semantic photo and video search."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  google_fonts: ^6.3.2
  sqflite: ^2.4.2
  path: ^1.9.1
  content_resolver: ^0.3.4
  permission_handler: ^12.0.1
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/clip_tokenizer/vocab.json
    - assets/clip_tokenizer/merges.txt
